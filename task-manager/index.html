<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="task-manager-app">
        <div class="task-card">
            <h1 class="task-card__title">My Task List</h1>

            <form id="task-form" class="task-form">
                <label class="task-form__label" for="new-task">Add a task</label>
                <div class="task-form__controls">
                    <input class="task-form__input" type="text" id="new-task" placeholder="Enter a new task">
                    <button class="task-form__button" type="submit">Add Task</button>
                </div>
            </form>

            <div id="tasks-list" class="task-list">
                <h2 class="task-list__title">Tasks</h2>
                <ul class="task-list__items"></ul>
            </div>

            <!-- the export button is to check whether the tasks status is proper updating or not -->
            <button id="export-tasks" class="task-form__button" style="margin-top: 32px;">Export</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
